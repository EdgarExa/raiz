[package]
name = "yucu-perpetual-royalties"
version = "1.0.0"
edition = "2021"
authors = ["Open Hub TecNM - Instituto Tecnológico de Tlaxiaco"]
license = "MIT"
description = "Perpetual Secondary Resale Royalties for Indigenous Female Artisans on Soroban"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
