[package]
name = "yucu-fair-escrow"
version = "1.0.0"
edition = "2021"
authors = ["Open Hub TecNM - Instituto Tecnológico de Tlaxiaco"]
license = "MIT"
description = "Trustless Fair-Trade Escrow with On-Chain Attestation Gates and MicoPay Rural Cash Integration"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
